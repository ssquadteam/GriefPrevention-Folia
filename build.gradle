plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'com.griefprevention'
version = '18.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'tcoded-releases'
        url = 'https://repo.tcoded.com/releases'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    implementation 'com.tcoded:FoliaLib:0.5.1'
    compileOnly 'org.jetbrains:annotations:26.0.2'

    testImplementation 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    testCompileOnly 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.1'
}

test {
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.tcoded.folialib', 'me.ryanhamshire.GriefPrevention.lib.folialib'
}

def gitDescribe = {
    try {
        def proc = ['git', 'describe', '--always', '--dirty'].execute(null, rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            return proc.in.text.trim()
        }
    } catch (ignored) {
    }
    return project.version
}()

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand([
            'git': [
                'commit': [
                    'id': [
                        'describe': gitDescribe
                    ]
                ]
            ]
        ])
    }
}
